<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fargate Blue/Green Lab</title>
  <style>
    :root { --accent: __APP_COLOR_HEX__; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 16px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1b2a; color: #e6edf3;
    }
    .card {
      width: 100%; max-width: 620px; padding: 32px;
      background: #1b2633; border: 1px solid #2f3e50; border-top: 8px solid var(--accent);
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 8px; }
    .badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: var(--accent); color: #0f1b2a; font-weight: 700; letter-spacing: 0.03em;
    }
    .flow { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .flow li { background: #2f3e50; border-radius: 999px; padding: 6px 14px; font-size: 14px; }
    .flow li:not(:last-child)::after { content: " →"; color: var(--accent); }
    .meta { color: #9aa7b4; font-size: 14px; }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello from ECS Fargate</h1>
    <p><span class="badge">VERSION __APP_VERSION__ · __APP_COLOR__</span></p>
    <p>This page is served by a container in a <strong>private subnet</strong>, behind an
       <strong>Application Load Balancer</strong>, deployed with <strong>ECS blue/green</strong>.</p>
    <ul class="flow">
      <li>Docker</li><li>Amazon ECR</li><li>ALB</li><li>ECS Fargate</li>
    </ul>
    <p class="meta">Built <code>__BUILD_TIME__</code> · <a href="/version.json" style="color:inherit">/version.json</a> · Lab by Kwaku Adae</p>
  </main>
</body>
</html>
