server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ALB target-group health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
